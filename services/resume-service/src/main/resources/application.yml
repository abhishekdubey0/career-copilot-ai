server:
  port: 8082

spring:
  application:
    name: resume-service

  datasource:
    url: jdbc:postgresql://localhost:5432/resume_db
    username: postgres
    password: Abhi@1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  resume:
    upload:
      directory: uploads/resumes
      max-file-size: 5242880